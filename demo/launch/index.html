<!doctype html><html><head><meta charset=utf-8><title>Putt Print — Launch Demo</title><meta name=viewport content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#0b2416;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;height:100vh}h1{color:#e9c46a;margin:14px 0 2px;font-size:22px}
#s{display:flex;gap:40px;align-items:center;flex:1;min-height:0;padding:10px}img{height:min(78vh,844px);border-radius:36px;border:6px solid #e9c46a;box-shadow:0 10px 40px #000}
.t{max-width:320px}.t h2{color:#e9c46a;font-size:34px;margin:0}.t p{font-size:20px;opacity:.9}.n{opacity:.6}
nav{padding:12px}button{background:#e9c46a;border:0;border-radius:10px;padding:10px 22px;font-size:17px;font-weight:700;margin:0 8px;cursor:pointer}</style></head><body>
<h1>Putt Print — Launch Demo</h1><div id=s><img id=i><div class=t><div class=n id=n></div><h2 id=h></h2><p id=p></p></div></div>
<nav><button onclick=go(-1)>‹ Prev</button><button onclick=go(1)>Next ›</button></nav>
<script>const S=[["01_icon.png", "Putt Print", "Stamp every shot. Chase your ghost."], ["02_login.png", "Login", "Name + colour, synced to the cloud."], ["03_courses.png", "Courses", "Shared course list \u2014 OSM-mapped or schematic, add your own."], ["04_setup.png", "Setup", "Pick LAST / BEST / PERFECT ghost and 1\u20134 players."], ["05_hole_play.png", "Hole play", "BEST GHOST ON \u2014 gold ghost line, tap the ball to stamp each shot."], ["06_multiplayer.png", "Multiplayer", "Host a room; friends join with the code on their own phones."], ["07_learned_clubs.png", "Learned clubs", "After 3+ shots, the picker shows your real average per club."], ["08_scorecard.png", "Scorecard", "Your round vs the ghost \u2014 saved to build next time's ghost."]];let k=0;function show(){const [f,h,p]=S[k];i.src=f;document.getElementById('h').textContent=h;document.getElementById('p').textContent=p;n.textContent=(k+1)+' / '+S.length}
function go(d){k=(k+d+S.length)%S.length;show()}document.onkeydown=e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))go(1);if(['ArrowLeft','PageUp'].includes(e.key))go(-1)};show()</script></body></html>
